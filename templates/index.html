<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhrubo - AI Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Dhrubo</h1>
      </div>
      <p class="subtitle">Swopnil Das's personal AI assistant — say hi</p>
    </header>

    <main class="chat-shell">
      <div id="chatArea" class="chat-area">
        <div class="msg bot">
          <div class="msg-label">Dhrubo</div>
          <div class="msg-text">Hey! I'm Dhrubo. What's on your mind?</div>
        </div>
      </div>

      <div class="tools-row">
        <button id="docxBtn" class="tool-btn" title="Ask Dhrubo to write a Word document">📄 Word doc</button>
        <button id="imgBtn" class="tool-btn" title="Ask Dhrubo to generate an image">🎨 Image</button>
      </div>

      <form id="chatForm" class="input-row">
        <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" />
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </main>

    <footer class="footer">Built by Swopnil Das · Team Zero</footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
